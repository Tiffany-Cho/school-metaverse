<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbe3c8" />
    <title>영파여고 온라인 캠퍼스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <!-- 로딩 화면은 스크립트·CSS 번들보다 먼저 보여야 해서 여기 인라인으로 둠 -->
    <style>html,body{background:#fbe3c8;height:100%;margin:0}#loader{z-index:100;color:#4a3f36;text-align:center;background:linear-gradient(170deg,#fdeedd 0%,#fbe3c8 42%,#f6d3d9 78%,#e6dcf0 100%);flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:24px;font-family:Gowun Dodum,system-ui,sans-serif;transition:opacity .9s,visibility .9s;display:flex;position:fixed;inset:0;overflow:hidden}#loader.is-done{opacity:0;visibility:hidden}.loader__scene{width:220px;height:120px;position:relative}.loader__school{background:#fffaf2;border-radius:6px 6px 2px 2px;width:92px;height:62px;position:absolute;bottom:14px;right:6px;box-shadow:0 6px 18px #7850321f}.loader__school:before{content:"";border:46px solid #0000;border-top:0;border-bottom:26px solid #d98a7a;width:0;margin-left:0;position:absolute;top:-26px;left:50%;transform:translate(-50%)}.loader__school:after{content:"";background:#c9935f;border-radius:9px 9px 0 0;width:18px;height:24px;position:absolute;bottom:0;left:50%;transform:translate(-50%);box-shadow:-28px -22px 0 -4px #b9d6e8,28px -22px 0 -4px #b9d6e8}.loader__road{background:#785a3c2e;border-radius:2px;height:4px;position:absolute;bottom:10px;left:0;right:0}.loader__walker{font-size:34px;line-height:1;animation:3.2s ease-in-out infinite walk;position:absolute;bottom:12px;left:0}.loader__walker span{animation:.5s ease-in-out infinite alternate bob;display:inline-block}.loader__title{letter-spacing:.02em;word-break:keep-all;margin:0;font-size:clamp(21px,6vw,26px);font-weight:400;line-height:1.4}.loader__title span{display:inline-block}.loader__title i{font-style:normal;animation:1.4s infinite dot;display:inline-block}.loader__title i:nth-child(2){animation-delay:.25s}.loader__bar{background:#ffffffa6;border-radius:999px;width:min(260px,70vw);height:8px;overflow:hidden;box-shadow:inset 0 1px 3px #7850321f}.loader__bar i{border-radius:inherit;background:linear-gradient(90deg,#f0a7b4,#c96f4f);width:12%;height:100%;transition:width .7s;display:block}.loader__foot{bottom:max(28px, env(safe-area-inset-bottom));letter-spacing:.2em;color:#c96f4f;margin:0;padding:0 16px;font-size:12px;position:absolute}.loader__petal{opacity:.8;background:#f4b6c2;border-radius:10px 0;width:10px;height:8px;animation:linear infinite fall;position:absolute;top:-20px}@keyframes walk{0%{transform:translate(0)}70%,to{transform:translate(134px)}}@keyframes bob{to{transform:translateY(-4px)}}@keyframes dot{0%,60%,to{opacity:.2}30%{opacity:1}}@keyframes fall{0%{transform:translate(0)rotate(0)}to{transform:translate(-60px,110vh)rotate(540deg)}}@media (prefers-reduced-motion:reduce){.loader__walker,.loader__walker span,.loader__petal,.loader__title i{animation:none}.loader__walker{transform:translate(60px)}}</style>
    <script type="module" crossorigin src="./assets/index-duQo6c5-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DI2djvQq.css">
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <i class="loader__petal" style="left: 12%; animation-duration: 9s"></i>
      <i class="loader__petal" style="left: 34%; animation-duration: 11s; animation-delay: -4s"></i>
      <i class="loader__petal" style="left: 58%; animation-duration: 8s; animation-delay: -2s"></i>
      <i class="loader__petal" style="left: 79%; animation-duration: 12s; animation-delay: -7s"></i>
      <i class="loader__petal" style="left: 92%; animation-duration: 10s; animation-delay: -5s"></i>
      <div class="loader__scene" aria-hidden="true">
        <div class="loader__school"></div>
        <div class="loader__road"></div>
        <div class="loader__walker"><span>🎒</span></div>
      </div>
      <h2 class="loader__title">등교중 ㅠㅠ <span><i>.</i><i>.</i>🎒</span></h2>
      <div class="loader__bar" role="progressbar" aria-label="불러오는 중" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"><i></i></div>
      <p class="loader__foot">YOUNGPA GIRLS' HIGH SCHOOL</p>
    </div>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
  </body>
</html>
